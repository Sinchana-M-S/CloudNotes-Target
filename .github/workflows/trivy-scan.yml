name: DevSecOps Trivy Vulnerability Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  # The webhook URL where Trivy scan results will be POSTed.
  # Set this as a GitHub Actions secret: Settings > Secrets > WEBHOOK_URL
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

jobs:
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout the repository ───────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Set up Node.js and install dependencies ───────
      # Trivy needs node_modules present to detect reachable vs
      # unreachable vulnerable dependencies accurately.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      # ── Step 3: Run Trivy filesystem scan ─────────────────────
      # Scans the repo for:
      #   - Vulnerable OS/language packages (SCA)
      #   - Misconfigurations (IaC)
      #   - Exposed secrets
      # Outputs results as JSON for programmatic consumption.
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          # Include all scanners: vuln (SCA), misconfig, secret
          scanners: 'vuln,misconfig,secret'

      # ── Step 4: Upload scan results as workflow artifact ──────
      # Persists the JSON report so it can be downloaded from the
      # GitHub Actions UI for manual review if needed.
      - name: Upload Trivy report artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-report
          path: trivy-results.json
          retention-days: 30

      # ── Step 5: POST results to the webhook endpoint ──────────
      # Sends the full Trivy JSON payload to your backend server
      # (e.g., InsightsHub remediation agent) via HTTP POST.
      - name: Send scan results to webhook
        if: env.WEBHOOK_URL != ''
        run: |
          echo "── Trivy Scan Summary ──"
          echo "File size: $(wc -c < trivy-results.json) bytes"
          echo "Vulnerabilities found: $(jq '[.Results[]?.Vulnerabilities // [] | .[] ] | length' trivy-results.json 2>/dev/null || echo 'N/A')"
          echo ""
          echo "Posting results to webhook..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Scanner: trivy" \
            -H "X-Repository: ${{ github.repository }}" \
            -H "X-Commit-SHA: ${{ github.sha }}" \
            -H "X-Branch: ${{ github.ref_name }}" \
            -H "X-Triggered-By: ${{ github.actor }}" \
            -d @trivy-results.json \
            "$WEBHOOK_URL")

          echo "Webhook response status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Scan results delivered successfully."
          else
            echo "⚠️ Webhook returned non-2xx status: $HTTP_STATUS"
            echo "The scan completed, but the results may not have been received by the backend."
          fi

      # ── Step 6: Print summary to workflow log ─────────────────
      - name: Print scan results summary
        if: always()
        run: |
          echo "══════════════════════════════════════════════════"
          echo "  TRIVY SCAN RESULTS SUMMARY"
          echo "══════════════════════════════════════════════════"
          echo ""

          if [ -f trivy-results.json ]; then
            echo "Total vulnerability entries:"
            jq '[.Results[]?.Vulnerabilities // [] | .[] ] | length' trivy-results.json 2>/dev/null || echo "Could not parse results"

            echo ""
            echo "Breakdown by severity:"
            jq -r '
              [.Results[]?.Vulnerabilities // [] | .[]] |
              group_by(.Severity) |
              .[] |
              "\(.[0].Severity): \(length)"
            ' trivy-results.json 2>/dev/null || echo "No vulnerability data available"

            echo ""
            echo "Affected packages:"
            jq -r '
              [.Results[]?.Vulnerabilities // [] | .[]] |
              unique_by(.PkgName) |
              .[] |
              "  • \(.PkgName)@\(.InstalledVersion) → \(.Severity) [\(.VulnerabilityID)]"
            ' trivy-results.json 2>/dev/null || echo "None detected"
          else
            echo "No results file found."
          fi

          echo ""
          echo "══════════════════════════════════════════════════"
